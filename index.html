<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Self-Learning Vehicles</title>
<style>
  /* Night circuit: ink surfaces with an indigo tint, neon for meaning. Cyan = cars, magenta = bikes, lime = the leader the net drives. */
  :root {
    --deep: #05060a; --bg: #07080d; --card: #0c0e17; --raised: #151826; --line: rgba(130,150,255,.12); --line-strong: rgba(130,150,255,.22);
    --text: #e8ecff; --text-2: #9aa3c7; --muted: #6f7799; --lead: #c6ff3d; --warn: #ffb020; --bad: #ff2d55;
    --car: #38e1ff; --bike: #ff4fd8; --primary: #38e1ff;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/20px system-ui, -apple-system, "Segoe UI", sans-serif; overscroll-behavior: none; }
  html, body { scrollbar-width: none; } html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; } /* the page scroll only drives the intro */
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--lead); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .fig { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* --side: width the open stats panel takes from the canvases (0 on narrow screens, where it overlays instead) */
  body.panel-open { --side: 320px; }
  @media (max-width: 760px) { body.panel-open { --side: 0px; } }
  #app { position: fixed; inset: 0; }
  body.at-hero { --side: 0px; } /* the live sim fills the screen behind the hero */

  /* landing hero: the 3D circuit is the visual (camera flies onto the grid as you scroll); a neutral scrim keeps the copy side calm */
  .landing-space { height: 200vh; }
  .hero { position: fixed; inset: 0; z-index: 20; }
  .hero-scrim { position: absolute; inset: 0; background:
    linear-gradient(180deg, rgba(5,6,10,.7) 0, rgba(5,6,10,0) 140px),
    linear-gradient(90deg, rgba(5,6,10,.9) 0%, rgba(5,6,10,.66) 34%, rgba(5,6,10,.1) 66%, rgba(5,6,10,0) 100%); }
  .hero-nav { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 24px 40px; }
  .hero-mark { font-size: 16px; line-height: 24px; font-weight: 500; }
  .hero-nav a { color: var(--text-2); text-decoration: none; transition: color .15s var(--ease); }
  .hero-nav a:hover { color: var(--text); }
  .hero-copy { position: absolute; top: 0; bottom: 0; left: 40px; right: 40px; max-width: 680px; display: flex; flex-direction: column; justify-content: center; padding-bottom: 4vh; }
  .hero-h1 { margin: 0 0 28px; font-size: clamp(56px, 8vw, 120px); line-height: .94; font-weight: 600; letter-spacing: -0.045em; }
  .hero-h1 .ln { display: block; overflow: hidden; padding-bottom: .06em; } /* mask for the rise-in */
  .hero-h1 .ln > span { display: block; }
  .hero-h1 .ln:nth-child(1) { color: #4a5175; }   /* crash -> learn -> race: the lines light up as the story resolves */
  .hero-h1 .ln:nth-child(2) { color: #9aa3c7; }
  .hero-h1 .ln:nth-child(3) { color: #f4f6ff; text-shadow: 0 0 32px rgba(56,225,255,.45), 0 0 2px rgba(56,225,255,.6); }
  .hero-sub { margin: 0 0 32px; max-width: 34rem; color: var(--text-2); font-size: 18px; line-height: 28px; }
  .hero-sub b { font-weight: 500; }
  .c-car { color: var(--car); text-shadow: 0 0 14px rgba(56,225,255,.5); } .c-bike { color: var(--bike); text-shadow: 0 0 14px rgba(255,79,216,.5); }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .hero-btn { height: 48px; padding: 0 24px; font-size: 15px; border-radius: 10px; }
  .hero-facts { display: flex; flex-wrap: wrap; gap: 32px; margin: 48px 0 0; padding-top: 20px; border-top: 1px solid var(--line); }
  .hero-facts dt { color: var(--muted); font-size: 12px; line-height: 16px; }
  .hero-facts dd { margin: 4px 0 0; font-size: 22px; line-height: 28px; color: var(--primary); text-shadow: 0 0 12px rgba(56,225,255,.4); }
  .hero-cue { position: absolute; left: 40px; bottom: 28px; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
  .hero-cue i { width: 96px; height: 2px; border-radius: 1px; background: var(--line-strong); overflow: hidden; }
  .hero-cue b { display: block; height: 100%; background: var(--primary); box-shadow: 0 0 8px var(--primary); transform-origin: left; transform: scaleX(0); }
  @media (max-width: 760px) {
    .hero-nav { padding: 16px 20px; }
    .hero-copy { left: 20px; right: 20px; padding-bottom: 10vh; }
    .hero-h1 { font-size: 52px; }
    .hero-sub { font-size: 16px; line-height: 24px; }
    .hero-facts { gap: 20px; margin-top: 32px; }
    .hero-facts dd { font-size: 18px; }
    .hero-cue { left: 20px; }
    .hero-scrim { background: linear-gradient(180deg, rgba(5,6,10,.5) 0%, rgba(5,6,10,.86) 45%, rgba(5,6,10,.95) 100%); }
  }

  /* before the first start: a card on the grid */
  .start-card { position: fixed; z-index: 4; left: calc((100% - var(--side, 0px)) / 2); top: 34%; transform: translate(-50%, -50%); width: min(400px, calc(100% - 32px)); box-sizing: border-box; padding: 24px; border-radius: 16px; background: rgba(9,10,18,.88); border: 1px solid var(--line-strong); text-align: center; box-shadow: 0 16px 48px rgba(0,0,0,.35); }
  .start-card[hidden] { display: none; }
  .start-card h2 { margin: 0 0 8px; font-size: 20px; line-height: 28px; font-weight: 500; }
  .start-card p { margin: 0 0 20px; color: var(--text-2); }
  .start-card small { display: block; margin-top: 12px; color: var(--muted); font-size: 12px; }
  #stage, #stage3d { position: fixed; top: 0; left: 0; height: 100%; width: calc(100% - var(--side, 0px)); display: block; }

  /* shared controls */
  .btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); cursor: pointer; white-space: nowrap; transition: background-color .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease); }
  .btn:hover { background: #1d2134; border-color: rgba(56,225,255,.35); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--primary); color: #021018; border-color: transparent; font-weight: 600; box-shadow: 0 0 0 1px rgba(56,225,255,.4), 0 0 20px rgba(56,225,255,.35); }
  .btn.primary:hover { background: #7aedff; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
  .btn.ghost:hover { background: var(--raised); color: var(--text); }
  select.btn { padding: 0 8px; }
  .seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 10px; background: var(--deep); border: 1px solid var(--line); }
  .seg label { position: relative; height: 26px; padding: 0 10px; display: inline-flex; align-items: center; border-radius: 8px; color: var(--text-2); cursor: pointer; transition: background-color .15s var(--ease), color .15s var(--ease); }
  .seg label:hover { color: var(--text); }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg label:has(input:checked) { background: var(--raised); color: var(--primary); box-shadow: inset 0 0 0 1px rgba(56,225,255,.35); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--lead); outline-offset: 1px; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  fieldset:disabled { opacity: .45; }
  fieldset:disabled label, .seg label:has(input:disabled) { cursor: not-allowed; }

  /* title over the canvas */
  .title { position: fixed; top: 16px; left: 16px; z-index: 4; max-width: calc(100% - var(--side, 0px) - 360px); padding: 8px 12px; border-radius: 12px; background: rgba(7,8,13,.72); border: 1px solid var(--line); pointer-events: none; }
  .title h1 { margin: 0; font-size: 15px; line-height: 20px; font-weight: 500; }
  .title p { margin: 0; color: var(--text-2); font-size: 12px; line-height: 16px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  body:has(#editor:not([hidden])) .title { display: none; } /* the editor has its own hint in that spot */

  .viewbar { position: fixed; top: 16px; right: calc(var(--side, 0px) + 16px); z-index: 4; display: flex; gap: 8px; }
  .viewbar .seg { background: rgba(9,10,18,.86); }
  body:not(.panel-open) .viewbar { right: 96px; } /* leave room for the Stats button */
  body:has(#editor:not([hidden])) .viewbar { display: none; }
  /* controls bar: groups never split; on narrow screens it becomes one swipeable strip */
  #controls { position: fixed; left: 16px; max-width: calc(100% - var(--side, 0px) - 56px); box-sizing: border-box; bottom: 16px; z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px; border-radius: 14px; background: rgba(9,10,18,.88); border: 1px solid var(--line); }
  #controls .group { display: flex; align-items: center; gap: 8px; }
  #controls .group + .group { padding-left: 12px; border-left: 1px solid var(--line); }
  #controls .lbl { color: var(--muted); font-size: 13px; }
  #speed { width: 72px; accent-color: var(--text); }
  #speed-out { display: inline-block; width: 28px; color: var(--text); }
  @media (max-width: 760px) {
    #controls { left: 8px; right: 8px; bottom: 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    #controls .group { flex: none; }
    .title { top: 8px; left: 8px; max-width: calc(100% - 96px); }
    .viewbar, body:not(.panel-open) .viewbar { top: auto; bottom: 72px; right: 8px; }
  }

  /* stats panel */
  #panel { position: fixed; top: 0; right: 0; z-index: 5; scrollbar-width: thin; scrollbar-color: rgba(130,150,255,.25) transparent; }
  body.panel-open #panel { bottom: 0; width: 320px; max-width: 100%; box-sizing: border-box; overflow-y: auto; background: var(--deep); border-left: 1px solid var(--line); padding: 16px; }
  body:not(.panel-open) #panel { top: 16px; right: 16px; }
  body:not(.panel-open) .panel-body, body:not(.panel-open) .spec { display: none; }
  @media (max-width: 760px) { body:not(.panel-open) #panel { top: 8px; right: 8px; } }
  .training { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .training .lbl { color: var(--muted); font-size: 13px; }
  .training select { flex: 1 1 calc(100% - 96px); }
  .training button { flex: 1 1 0; } /* Restart and Save share the second row equally */
  .panel-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  .spec { flex: 1; margin: 0; color: var(--text-2); font-size: 13px; line-height: 20px; }
  #panel h2 { font-size: 11px; line-height: 16px; font-weight: 500; color: var(--muted); margin: 24px 0 8px; font-family: var(--mono); letter-spacing: .06em; }
  .card { display: block; position: relative; padding: 12px; margin-bottom: 8px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); cursor: pointer; transition: border-color .15s var(--ease), background-color .15s var(--ease); }
  .card:hover { background: #1d1d1f; }
  .card:has(input:checked) { border-color: rgba(198,255,61,.55); box-shadow: 0 0 24px rgba(198,255,61,.08), inset 0 0 24px rgba(198,255,61,.04); }
  .card:has(input:focus-visible) { outline: 2px solid var(--lead); outline-offset: 2px; }
  .card input[type=radio] { position: absolute; opacity: 0; pointer-events: none; }
  .card .head { display: flex; align-items: center; gap: 8px; }
  .card .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .card { border-left: 2px solid var(--c); }
  .card .head b { font-weight: 500; }
  .card .follow { margin-left: auto; font-size: 12px; color: var(--muted); }
  .card:has(input:checked) .follow { color: var(--lead); }
  .card .figs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 8px 0; }
  .card .figs small { display: block; font-size: 11px; line-height: 16px; color: var(--muted); font-family: var(--mono); letter-spacing: .04em; }
  .card .figs b { display: block; font-size: 24px; line-height: 28px; font-weight: 500; font-family: inherit; color: var(--c); text-shadow: 0 0 12px color-mix(in srgb, var(--c) 45%, transparent); }
  .card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; line-height: 24px; }
  .card .row b { color: var(--text); font-weight: 400; }
  .card .xfer { color: var(--text); }
  .card .done[hidden], .card .xfer[hidden], .results[hidden] { display: none; }
  .dmg { width: 96px; height: 4px; border-radius: 2px; background: var(--raised); overflow: hidden; }
  .dmg i { display: block; height: 100%; background: var(--lead); box-shadow: 0 0 6px var(--lead); transform-origin: left; transform: scaleX(0); }
  .dmg[data-level="warn"] i { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  .dmg[data-level="bad"] i { background: var(--bad); box-shadow: 0 0 6px var(--bad); }
  .results { padding: 12px; margin-bottom: 8px; border-radius: 12px; background: var(--card); border: 1px solid var(--line-strong); }
  .results p { margin: 0 0 12px; color: var(--text); }
  #panel canvas { display: block; width: 100%; }
  #panel .chart { height: 140px; }
  #panel .nn { height: 216px; }

  /* banner: first laps and notices */
  .celebrate { position: fixed; top: 16px; left: calc((100% - var(--side, 0px)) / 2); z-index: 6; pointer-events: none; visibility: hidden; padding: 12px 20px; border-radius: 12px; background: rgba(12,14,23,.92); border: 1px solid rgba(198,255,61,.5); text-shadow: 0 0 12px rgba(198,255,61,.35); color: var(--text); font-size: 16px; line-height: 24px; font-weight: 500; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.35); }

  /* track editor */
  #editor { position: fixed; inset: 0; width: 100%; height: 100%; background: var(--bg); z-index: 10; cursor: crosshair; }
  #editor[hidden], .editor-panel[hidden], .editor-hint[hidden] { display: none; }
  .editor-panel { position: fixed; left: 16px; bottom: 16px; z-index: 11; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 14px; background: rgba(9,10,18,.88); border: 1px solid var(--line); }
  .editor-hint { position: fixed; top: 16px; left: 16px; z-index: 11; margin: 0; padding: 8px 12px; border-radius: 12px; background: rgba(9,10,18,.86); border: 1px solid var(--line); color: var(--text-2); }
  .editor-hint b { color: var(--text); font-weight: 500; }
  .editor-msg { margin: 0 0 0 8px; color: #ff8a80; }
</style></head>
<body><div id="app"></div><script type="module" src="/src/main.ts"></script></body></html>
