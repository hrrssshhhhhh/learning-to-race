<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Self-Learning Vehicles</title><link rel="icon" href="data:," />
<style>
  /* Race broadcast design language: carbon black, white, broadcast red for actions and the followed leader.
     Team colours (papaya cars, blue bikes) are data. Purple = fastest lap, as on real timing screens. */
  :root {
    --carbon: #0b0b0f; --bg: #15151e; --panel: #101016; --row: #1b1b24; --row-hi: #24242f; --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.16);
    --text: #ffffff; --text-2: #b8b8c2; --muted: #7d7d88; --red: #e10600; --red-hi: #ff1e1a; --purple: #a020f0; --green: #00d26a; --warn: #ffb800;
    --car: #ff8000; --bike: #4d8df7;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif; --ui: "Barlow", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/20px var(--ui); overscroll-behavior: none; }
  html, body { scrollbar-width: none; } html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; } /* the page scroll only drives the intro */
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--red-hi); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .fig { font-family: var(--display); font-variant-numeric: tabular-nums; }

  /* --side: width the open panel takes from the canvases (0 on narrow screens, where it overlays instead) */
  body.panel-open { --side: 340px; }
  @media (max-width: 760px) { body.panel-open { --side: 0px; } }
  #app { position: fixed; inset: 0; }
  body.at-hero { --side: 0px; }
  #stage, #stage3d { position: fixed; top: 0; left: 0; height: 100%; width: calc(100% - var(--side, 0px)); display: block; }

  /* buttons: sharp, like broadcast tabs; the red one is the action */
  .btn { position: relative; height: 36px; padding: 0 16px; border: 0; border-radius: 2px; background: var(--row-hi); color: var(--text); cursor: pointer; white-space: nowrap;
    font: 600 15px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; transition: background-color .15s var(--ease), transform .15s var(--ease); }
  .btn:hover { background: #30303d; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--red); }
  .btn.primary:hover { background: var(--red-hi); }
  .btn.ghost { background: transparent; color: var(--text-2); }
  .btn.ghost:hover { background: var(--row); color: var(--text); }
  select.btn { padding: 0 10px; text-transform: none; font: 500 14px/1 var(--ui); letter-spacing: 0; }
  .seg { display: inline-flex; border-radius: 2px; overflow: hidden; background: var(--carbon); border: 1px solid var(--line); }
  .seg label { position: relative; height: 32px; padding: 0 12px; display: inline-flex; align-items: center; color: var(--muted); cursor: pointer;
    font: 600 14px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; transition: color .15s var(--ease), background-color .15s var(--ease); }
  .seg label:hover { color: var(--text); }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg label:has(input:checked) { background: var(--row-hi); color: var(--text); box-shadow: inset 0 -2px 0 var(--red); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--red-hi); outline-offset: -2px; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  fieldset:disabled { opacity: .45; }
  fieldset:disabled label, .seg label:has(input:disabled) { cursor: not-allowed; }

  /* title: a broadcast lower-third, top left */
  .title { position: fixed; top: 16px; left: 16px; z-index: 4; max-width: calc(100% - var(--side, 0px) - 360px); display: flex; align-items: stretch; pointer-events: none; }
  .title h1 { margin: 0; padding: 6px 14px 6px 12px; background: var(--red); font: italic 800 18px/24px var(--display); letter-spacing: .02em; text-transform: uppercase;
    clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); white-space: nowrap; }
  .title p { margin: 0 0 0 -6px; padding: 6px 14px 6px 18px; background: rgba(11,11,15,.88); color: var(--text-2); font: 600 15px/24px var(--display); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body:has(#editor:not([hidden])) .title { display: none; }

  .viewbar { position: fixed; top: 16px; right: calc(var(--side, 0px) + 16px); z-index: 4; display: flex; gap: 8px; }
  body:not(.panel-open) .viewbar { right: 104px; }
  body:has(#editor:not([hidden])) .viewbar { display: none; }

  /* bottom control strip */
  #controls { position: fixed; left: 16px; bottom: 16px; z-index: 4; max-width: calc(100% - var(--side, 0px) - 32px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 8px; background: rgba(11,11,15,.92); border-top: 2px solid var(--red); border-radius: 2px; }
  #controls .group { display: flex; align-items: center; gap: 8px; }
  #controls .group + .group { padding-left: 12px; border-left: 1px solid var(--line); }
  #speed { width: 80px; accent-color: var(--red); }
  #speed-out { display: inline-block; width: 32px; font-size: 18px; }
  @media (max-width: 760px) {
    #controls { left: 8px; right: 8px; bottom: 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    #controls .group { flex: none; }
    .title { top: 8px; left: 8px; max-width: calc(100% - 96px); }
    .title p { display: none; }
    .viewbar, body:not(.panel-open) .viewbar { top: auto; bottom: 72px; right: 8px; }
  }

  /* timing tower panel */
  #panel { position: fixed; top: 0; right: 0; z-index: 5; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; }
  body.panel-open #panel { bottom: 0; width: 340px; max-width: 100%; box-sizing: border-box; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 0 0 24px; }
  body:not(.panel-open) #panel { top: 16px; right: 16px; }
  body:not(.panel-open) .panel-body, body:not(.panel-open) .spec { display: none; }
  @media (max-width: 760px) { body:not(.panel-open) #panel { top: 8px; right: 8px; } }
  .panel-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--carbon); border-bottom: 2px solid var(--red); }
  body:not(.panel-open) .panel-head { padding: 0; background: none; border: 0; }
  .spec { flex: 1; margin: 0; color: var(--text-2); font-size: 13px; line-height: 18px; }
  .panel-body { padding: 0 16px; }
  #panel h2 { margin: 24px 0 10px; font: italic 700 15px/20px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--text); display: flex; align-items: center; gap: 8px; }
  #panel h2::before { content: ""; width: 4px; height: 14px; background: var(--red); transform: skewX(-12deg); }
  .training { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .training .lbl { color: var(--muted); font: 600 13px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; }
  .training select { flex: 1 1 calc(100% - 100px); }
  .training button { flex: 1 1 0; }
  .training input[type=number] { width: 72px; }
  .training #max-gen-u { flex: 1 1 auto; }

  /* each population is a tower row: position, team bar, name, then its numbers */
  .pops { margin-top: 16px; }
  .card { display: block; position: relative; padding: 12px 12px 12px 16px; margin-bottom: 4px; background: var(--row); cursor: pointer; transition: background-color .15s var(--ease); }
  .card:hover { background: var(--row-hi); }
  .card:has(input:checked) { background: var(--row-hi); box-shadow: inset 4px 0 0 var(--red); }
  .card:has(input:focus-visible) { outline: 2px solid var(--red-hi); outline-offset: 2px; }
  .card input[type=radio] { position: absolute; opacity: 0; pointer-events: none; }
  .card .head { display: flex; align-items: center; gap: 10px; }
  .card .pos { width: 32px; font: italic 800 22px/1 var(--display); color: var(--text); }
  .card .dot { width: 4px; height: 22px; background: var(--c); transform: skewX(-12deg); }
  .card .head b { font: italic 700 20px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; }
  .card .follow { margin-left: auto; font: 600 12px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .card:has(input:checked) .follow { color: var(--red-hi); }
  .card .figs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0 8px; }
  .card .figs small { display: block; font: 600 12px/16px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .card .figs b { display: block; font: 700 32px/36px var(--display); font-variant-numeric: tabular-nums; }
  .card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--text-2); font-size: 14px; line-height: 26px; border-top: 1px solid var(--line); }
  .card .row b { color: var(--text); font: 600 17px/1 var(--display); font-variant-numeric: tabular-nums; }
  .card .row b.fastest { color: #fff; background: var(--purple); padding: 3px 6px; } /* a lap time exists: purple, like a fastest lap */
  .card .xfer { color: var(--green); }
  .card .done[hidden], .card .xfer[hidden], .results[hidden] { display: none; }
  .dmg { width: 96px; height: 6px; background: var(--carbon); overflow: hidden; }
  .dmg i { display: block; height: 100%; background: var(--green); transform-origin: left; transform: scaleX(0); }
  .dmg[data-level="warn"] i { background: var(--warn); }
  .dmg[data-level="bad"] i { background: var(--red); }
  .results { margin-top: 16px; padding: 12px; background: var(--carbon); border-left: 4px solid var(--red); }
  .results p { margin: 0 0 12px; font: 700 18px/24px var(--display); text-transform: uppercase; letter-spacing: .02em; }
  #panel canvas { display: block; width: 100%; }
  #panel .chart { height: 168px; }
  #panel .nn { height: 220px; }

  /* banner: first laps and notices, a broadcast caption */
  .celebrate { position: fixed; top: 64px; left: calc((100% - var(--side, 0px)) / 2); z-index: 6; pointer-events: none; visibility: hidden; padding: 10px 20px 10px 16px; background: var(--carbon); border-left: 6px solid var(--red);
    color: var(--text); font: italic 700 20px/24px var(--display); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }

  /* start lights: five columns of two red lamps, then lights out */
  .lights { position: fixed; z-index: 7; top: 22%; left: calc((100% - var(--side, 0px)) / 2); transform: translateX(-50%); display: flex; gap: 10px; padding: 12px; background: #050507; border-radius: 4px; pointer-events: none; }
  .lights[hidden] { display: none; }
  .lights .col { display: grid; gap: 8px; padding: 8px; background: #121217; border-radius: 3px; }
  .lights i { width: 34px; height: 34px; border-radius: 50%; background: #2a0d0d; }
  .lights .col.on i { background: radial-gradient(circle at 40% 35%, #ff6b5e, #e10600 55%, #8a0400); box-shadow: 0 0 18px rgba(225,6,0,.8); } /* a lit lamp is a light source */

  /* before the first start */
  .start-card { position: fixed; z-index: 4; left: calc((100% - var(--side, 0px)) / 2); bottom: 88px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; padding: 10px 10px 10px 16px; background: rgba(11,11,15,.94); border-left: 4px solid var(--red); }
  .start-card[hidden] { display: none; }
  .start-card p { margin: 0; font: 600 17px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--text-2); white-space: nowrap; }
  .start-card small { display: none; }
  @media (max-width: 760px) { .start-card { bottom: 120px; } .start-card p { display: none; } }

  /* landing: floodlit circuit behind, poster type in front */
  .landing-space { height: 200vh; }
  .hero { position: fixed; inset: 0; z-index: 20; }
  .hero-scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(11,11,15,.92) 0%, rgba(11,11,15,.7) 38%, rgba(11,11,15,.1) 70%, rgba(11,11,15,0) 100%); }
  .hero-nav { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 24px 40px; }
  .hero-mark { font: italic 800 18px/24px var(--display); letter-spacing: .04em; text-transform: uppercase; }
  .hero-mark::before { content: ""; display: inline-block; width: 18px; height: 12px; margin-right: 10px; background: var(--red); transform: skewX(-20deg); vertical-align: 1px; }
  .hero-nav a { color: var(--text-2); text-decoration: none; font: 600 15px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; transition: color .15s var(--ease); }
  .hero-nav a:hover { color: var(--text); }
  .hero-copy { position: absolute; top: 0; bottom: 0; left: 40px; right: 40px; max-width: 760px; display: flex; flex-direction: column; justify-content: center; padding-bottom: 4vh; }
  .hero-tag { align-self: flex-start; margin: 0 0 20px; padding: 6px 14px; background: var(--red); font: italic 700 15px/1 var(--display); letter-spacing: .08em; text-transform: uppercase;
    clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
  .hero-h1 { margin: 0 0 24px; font: italic 800 clamp(64px, 9.5vw, 150px)/.86 var(--display); letter-spacing: -0.01em; text-transform: uppercase; }
  .hero-h1 .ln { display: block; overflow: hidden; padding: 0 .06em .04em 0; }
  .hero-h1 .ln > span { display: block; }
  .hero-h1 .ln:nth-child(2) { color: transparent; -webkit-text-stroke: 2px #fff; } /* outline second line: poster contrast without a second colour */
  .hero-sub { margin: 0 0 32px; max-width: 34rem; color: var(--text-2); font-size: 18px; line-height: 28px; }
  .hero-sub b { font-weight: 600; }
  .c-car { color: var(--car); } .c-bike { color: var(--bike); }
  .hero-figs { display: flex; gap: 0; margin: 0 0 32px; }
  .hero-figs div { display: flex; flex-direction: column; gap: 6px; padding: 0 24px; border-left: 1px solid var(--line-strong); }
  .hero-figs div:first-child { padding-left: 0; border-left: 0; }
  .hero-figs dd { margin: 0; order: -1; font: italic 700 40px/1 var(--display); color: var(--text); }
  .hero-figs dt { color: var(--muted); font: 600 13px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .hero-btn { height: 52px; padding: 0 28px; font-size: 19px; clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
  .hero-cue { position: absolute; left: 40px; bottom: 32px; display: flex; align-items: center; gap: 12px; color: var(--muted); font: 600 14px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; }
  .hero-cue i { width: 120px; height: 3px; background: var(--line-strong); overflow: hidden; }
  .hero-cue b { display: block; height: 100%; background: var(--red); transform-origin: left; transform: scaleX(0); }
  .hero-chequer { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; opacity: .9;
    background: repeating-conic-gradient(#fff 0 25%, #0b0b0f 0 50%) 0 0 / 12px 12px; } /* the chequered flag along the foot of the poster */
  /* telemetry cards: what the project is made of, in the space the circuit leaves */
  .hero-deck { position: absolute; inset: 0; pointer-events: none; }
  .tele { position: absolute; width: 360px; padding: 12px 16px 14px; box-sizing: border-box; background: rgba(11,11,15,.84); border-top: 2px solid var(--red); }
  .tele h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font: italic 700 15px/20px var(--display); letter-spacing: .06em; text-transform: uppercase; }
  .tele h2::before { content: ""; width: 4px; height: 14px; background: var(--red); transform: skewX(-12deg); }
  .tele h2 small { margin-left: auto; color: var(--muted); font: 600 13px/1 var(--display); font-style: normal; letter-spacing: .05em; }
  .tele h2 small b { color: var(--text); font-weight: 600; }
  .tele canvas { display: block; width: 100%; }
  .tele-brain { top: 88px; right: 40px; width: 400px; }
  .tele-nn { height: 176px; }
  .tele-foot { display: flex; align-items: center; gap: 10px; margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--line); color: var(--text-2); font-size: 14px; }
  .tele-foot i { width: 3px; height: 3px; background: var(--muted); }
  .tele-eyes { right: 416px; bottom: 44px; width: 280px; }
  .tele-rays { height: 104px; }
  .tele-eyes, .tele-evo { height: 204px; }
  .tele-out { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; color: var(--muted); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
  .tele-out span { display: flex; flex-direction: column; gap: 6px; }
  .bar { position: relative; display: block; height: 4px; background: var(--line-strong); overflow: hidden; }
  .bar i { position: absolute; inset: 0; background: var(--text); transform-origin: left; }
  .bar.mid i { background: var(--red-hi); transform-origin: center; }
  .bar.mid::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
  .tele-evo { right: 40px; bottom: 44px; }
  .tele-evo ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
  .tele-evo li { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 8px; height: 26px; padding: 0 8px; color: var(--muted); font-size: 13px;
    box-shadow: inset 2px 0 0 transparent; transition: background-color .3s var(--ease), color .3s var(--ease), box-shadow .3s var(--ease); }
  .tele-evo li b { color: var(--text-2); font: italic 700 15px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
  .tele-evo li.on { background: var(--row); color: var(--text-2); box-shadow: inset 2px 0 0 var(--red); }
  .tele-evo li.on b { color: var(--text); }
  @media (max-width: 760px) {
    .hero-figs dd { font-size: 32px; }
    .hero-figs div { padding: 0 16px; }
    .hero-nav { padding: 16px 20px; }
    .hero-copy { left: 20px; right: 20px; padding-bottom: 10vh; }
    .hero-h1 { font-size: 64px; }
    .hero-sub { font-size: 16px; line-height: 24px; }
    .hero-cue { left: 20px; bottom: 28px; }
    .hero-scrim { background: linear-gradient(180deg, rgba(11,11,15,.45) 0%, rgba(11,11,15,.88) 45%, rgba(11,11,15,.95) 100%); }
  }

  /* track editor */
  #editor { position: fixed; inset: 0; width: 100%; height: 100%; background: var(--bg); z-index: 10; cursor: crosshair; }
  #editor[hidden], .editor-panel[hidden], .editor-hint[hidden] { display: none; }
  .editor-panel { position: fixed; left: 16px; bottom: 16px; z-index: 11; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px; background: rgba(11,11,15,.94); border-top: 2px solid var(--red); }
  .editor-hint { position: fixed; top: 16px; left: 16px; z-index: 11; margin: 0; padding: 8px 14px; background: rgba(11,11,15,.94); border-left: 4px solid var(--red); color: var(--text-2); }
  .editor-hint b { color: var(--text); font: italic 700 17px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; }
  .editor-msg { margin: 0 0 0 8px; color: #ff6b5e; font-weight: 600; }
</style></head>
<body><div id="app"></div><script type="module" src="/src/main.ts"></script></body></html>
