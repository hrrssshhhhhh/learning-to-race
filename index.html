<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Self-Learning Vehicles</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1115; color: #e6e8ee; font: 14px system-ui, sans-serif; overflow: hidden; }
  /* --side: width the open stats panel takes from the canvases (0 on narrow screens, where it overlays instead) */
  body.panel-open { --side: 320px; }
  @media (max-width: 760px) { body.panel-open { --side: 0px; } }
  #app { position: fixed; inset: 0; }
  #stage, #stage3d { position: fixed; top: 0; left: 0; height: 100%; width: calc(100% - var(--side, 0px)); display: block; }
  #panel { position: fixed; top: 0; right: 0; z-index: 5; font-variant-numeric: tabular-nums; }
  body.panel-open #panel { bottom: 0; width: 320px; max-width: 100%; box-sizing: border-box; overflow-y: auto; background: rgba(21,24,33,.95); border-left: 1px solid #2a2f3a; padding: 10px 14px; }
  body:not(.panel-open) #panel { top: 8px; right: 12px; }
  body:not(.panel-open) .panel-body { display: none; }
  .panel-toggle { font: inherit; padding: 4px 10px; float: right; }
  .spec { margin: 2px 0 12px; color: #c3c7d1; line-height: 1.4; }
  #panel h2 { font-size: 13px; font-weight: 600; color: #9aa0ad; margin: 14px 0 6px; }
  .card { display: block; border: 1px solid #2a2f3a; border-left: 4px solid var(--c); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
  .card:has(input:checked) { background: #1d212b; border-color: #6ee7a0; border-left-color: var(--c); }
  .card .head { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
  .card .head small { color: #9aa0ad; margin-left: auto; }
  .card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: #c3c7d1; line-height: 1.5; }
  .card .row b { color: #fff; }
  .card meter { width: 110px; }
  #panel canvas { display: block; width: 100%; }
  #panel .chart { height: 120px; }
  #panel .nn { height: 200px; }
  .celebrate { position: fixed; top: 24px; left: calc((100% - var(--side, 0px)) / 2); z-index: 6; pointer-events: none; visibility: hidden; padding: 12px 22px; border-radius: 12px; background: #6ee7a0; color: #0f1115; font-size: 20px; font-weight: 700; white-space: nowrap; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  #controls { position: fixed; bottom: 8px; left: 12px; max-width: calc(100% - var(--side, 0px) - 48px); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; background: rgba(15,17,21,.8); padding: 8px 12px; border-radius: 8px; }
  #controls fieldset { border: 0; margin: 0; padding: 0; display: flex; gap: 12px; }
  #controls legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  #controls legend.show { position: static; width: auto; height: auto; overflow: visible; clip: auto; float: left; padding: 0; color: #9aa0ad; }
  #controls fieldset:disabled { opacity: .45; }
  #controls button { font: inherit; padding: 4px 10px; }
  #editor { position: fixed; inset: 0; width: 100%; height: 100%; background: #0f1115; z-index: 10; cursor: crosshair; }
  #editor[hidden], .editor-panel[hidden] { display: none; }
  .editor-panel { position: fixed; bottom: 8px; left: 12px; z-index: 11; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: rgba(15,17,21,.8); padding: 8px 12px; border-radius: 8px; }
  .editor-panel button { font: inherit; padding: 4px 10px; }
  .editor-msg { margin: 0; color: #ff8a80; font-weight: 600; }
</style></head>
<body><div id="app"></div><script type="module" src="/src/main.ts"></script></body></html>
